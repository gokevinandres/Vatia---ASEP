function linsolve(A,b){const n=b.length,M=A.map((r,i)=>[...r,b[i]]);

  for(let r=c+1;r<n;r++){const k=M[r][c]/M[c][c];for(let j=c;j<=n;j++)M[r][j]-=k*M[c][j]}}
 const x=Array(n).fill(0);for(let i=n-1;i>=0;i--){let s=M[i][n];for(let j=i+1;j<n;j++)s-=M[i][j]*x[j];x[i]=s/M[i][i]}return x}

function edCalc(n,loads,lines,gens,slack=0){
 const ns=[...Array(n).keys()].filter(i=>i!=slack),nG=gens.length,nL=lines.length,Bf=[...Array(n)].map(_=>Array(n).fill(0));

   const sf=fl[wk]>0?1:-1;let best=null;
   for(let u=0;u<nG;u++){const au=gens[u].cap-P[u];if(au<1e-6)continue;
    for(let d=0;d<nG;d++){if(u==d)continue;const ad=P[d];if(ad<1e-6)continue;const df=sf*(ISF[wk][gens[u].bus]-ISF[wk][gens[d].bus]);if(df>=-1e-9)continue;

    for(const l of cg){const sf=fl[l]>0?1:-1,A=sf*(ISF[l][bu]-ISF[l][bd]),B=sf*(ISF[l][bd]-ISF[l][k]);
     if(Math.abs(A)<1e-9){if(B>1e-9){fe=false;break}}else if(A>0)hi=Math.min(hi,-B/A);else lo=Math.max(lo,-B/A)}
    if(!fe||lo>hi+1e-9)continue;const ao=gens[u].mc>gens[d].mc?lo:hi;let c=ao*gens[u].mc-(ao-1)*gens[d].mc;if(c<0)c=Math.max(gens[u].mc,gens[d].mc);if(best==null||c<best)best=c}}
  return best==null?Math.max(...gens.map(g=>g.mc)):Math.max(best,0)};
 const alts=(P,fl)=>{const out=[],cg=lines.map((_,k)=>k).filter(k=>Math.abs(fl[k])>lines[k].cap+1e-3);if(!cg.length)return out;const cand=new Set();
  for(const k of cg){const sf=fl[k]>0?1:-1,ex=Math.abs(fl[k])-lines[k].cap;
   for(let u=0;u<nG;u++){if(gens[u].cap-P[u]<1e-6)continue;for(let d=0;d<nG;d++){if(u==d||P[d]<1e-6)continue;const df=sf*(ISF[k][gens[u].bus]-ISF[k][gens[d].bus]);if(df>=-1e-9)continue;
    if(Math.min(ex/(-df),gens[u].cap-P[u],P[d])<1e-6)continue;cand.add(u+','+d+','+k)}}}
  for(const s of cand){const[u,d,k0]=s.split(',').map(Number),sf=fl[k0]>0?1:-1,ex=Math.abs(fl[k0])-lines[k0].cap,df=sf*(ISF[k0][gens[u].bus]-ISF[k0][gens[d].bus]);if(df>=-1e-9)continue;
   const d0=Math.min(ex/(-df),gens[u].cap-P[u],P[d]);if(d0<1e-6)continue;const Pi=[...P];Pi[u]+=d0;Pi[d]-=d0;const[Pf,it]=redesp(Pi),ff=flows(Pf);if(!ff)continue;
   const costo=gens.reduce((a,g,i)=>a+g.mc*Pf[i],0),res=lines.every((L,k)=>Math.abs(ff[k])<=L.cap+1e-3);
   if(out.some(a=>a.P.every((v,g)=>Math.abs(v-Pf[g])<.01)))continue;out.push({P:Pf,flows:ff,costo,d0,u,d,k0,it,res})}
  return out.sort((a,b)=>a.costo-b.costo)};
 const PED=merit(),fED=flows(PED),cED=gens.reduce((a,g,i)=>a+g.mc*PED[i],0),cong=lines.map((_,k)=>k).filter(k=>Math.abs(fED[k])>lines[k].cap+1e-6);
 let Pf,it=0,conv=true,alt=[];if(cong.length){[Pf,it,conv]=redesp(PED);alt=alts(PED,fED)}else Pf=[...PED];
 const ff=flows(Pf),cf=gens.reduce((a,g,i)=>a+g.mc*Pf[i],0),pr=[...Array(n).keys()].map(k=>precio(k,Pf,ff));
 const cgen=lines.map((_,l)=>gens.map((g,i)=>ISF[l][g.bus]*Pf[i])),cneta=lines.map((_,l)=>[...Array(n).keys()].map(i=>{let inj=-loads[i];gens.forEach((g,q)=>{if(g.bus==i)inj+=Pf[q]});return ISF[l][i]*inj}));
 return{n,loads,lines,gens,PED,fED,cED,Pf,ff,cf,cs:cf-cED,cong,it,conv,pr,ISF,alt,cgen,cneta}}

let R=null;const N=id=>P($('#'+id).value,0),rows=(n,f)=>[...Array(n).keys()].map(f).join('');

 for(let i=0;i<n;i++){const a=P($(`#l${i}_0`).value)-1,b=P($(`#l${i}_1`).value)-1,x=F($(`#l${i}_2`).value,.1),cap=F($(`#l${i}_3`).value,100);if(ok(a,b)&&Math.abs(x)>1e-9)lines.push({a,b,x,cap})}
 for(let i=0;i<N('nG');i++){const b=P($(`#g${i}_0`).value)-1,cap=F($(`#g${i}_1`).value),mc=F($(`#g${i}_2`).value);if(b>=0&&b<n&&cap>0)gens.push({bus:b,cap,mc})}return{n,loads,lines,gens}}

 R=edCalc(c.n,c.loads,c.lines,c.gens,0);stat('Despacho calculado.','var(--sl)');upd();show()}catch(e){alert('Error en el cálculo:\n'+e.message)}}

 const t1=`<div class="sc">${cong?'⚠ El despacho por mérito congestiona '+r.cong.length+' línea(s): '+r.cong.map(k=>ln(r,k)).join(', '):'✓ Sin congestión: el despacho por mérito es factible'}</div>`+tb(['Concepto','Valor'],[['Demanda total (MW)',f2(tl)],['Costo despacho económico ($/h)',f2(r.cED)],['Costo con redespacho ($/h)',f2(r.cf)],['Costo de seguridad ($/h)',f2(r.cs)],['Iteraciones de redespacho',r.it],['Convergió',r.conv?'Sí':'No']]);
