<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vatia — Simulador de Sistemas de Potencia</title>
<style>
:root{--bg:#EDF1F6;--p:#fff;--s:#F7F9FC;--sb:#E2E8F0;--pr:#1E3A5F;--pl:#2C5282;--pd:#152741;--ac:#0E7490;--sl:#047857;--pv:#6D28D9;--pq:#C2410C;--in:#0369A1;--am:#B45309;--tx:#1F2937;--tl:#4B5563;--tll:#94A3B8;--bd:#CBD5E1;--er:#B91C1C}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13px "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh}
header{background:var(--pd);height:130px;border-top:4px solid var(--ac);position:relative;display:flex;align-items:center;justify-content:center}
.badge{position:absolute;left:24px;top:50%;transform:translateY(-50%);background:var(--ac);color:#fff;text-align:center;padding:6px 14px}
.badge small{display:block;font:700 8px inherit;color:var(--pd)}.badge b{font-size:13px}
.card{background:var(--p);border:1px solid var(--bd);margin:4px 14px;padding:10px 18px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.card.t{margin-top:10px;padding:12px 18px}
label,.l{color:var(--tl);font-size:12px}.hl{font-weight:700;color:var(--pr);font-size:12px;margin-right:12px}.u{font-weight:700;color:var(--ac);font-size:12px;margin-right:14px}
input,select{font:inherit;padding:5px;border:1px solid var(--bd);background:var(--s);color:var(--tx);text-align:center;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac)}input.bad{color:var(--er)}
.card input.w{width:64px}
button{font:700 12px inherit;border:0;padding:8px 14px;color:#fff;background:var(--pr);cursor:pointer}
button:hover:not(:disabled){filter:brightness(1.15)}button:disabled{cursor:default;opacity:.55}
.sf{background:var(--s);color:var(--tl)}.gr{display:flex;flex-direction:column;gap:4px;margin-right:16px}.gr small{font:700 8px inherit;color:var(--tl);text-transform:uppercase}.gr div{display:flex;gap:4px}
main{flex:1;display:grid;grid-template-columns:210px minmax(0,1fr) 380px;gap:6px;margin:6px 10px;min-height:520px}
#side{background:var(--sb);display:flex;flex-direction:column}#side h4{margin:0;background:var(--pr);color:#fff;padding:10px;font-size:12px;text-align:center;border-bottom:2px solid var(--ac)}
.st{padding:10px 14px 2px}.st small{display:block;font:700 8px inherit;color:var(--tl);text-transform:uppercase}.st b{font-size:18px}
hr{border:0;border-top:1px solid var(--bd);margin:8px 14px}.pie{margin-top:auto;text-align:center;padding:10px;color:var(--tl);font-size:11px}.pie i{display:block}.pie span{font:10px Consolas,monospace;color:var(--tll)}
#nb{background:var(--p);border:1px solid var(--bd);display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;background:var(--bg)}.tabs button{background:var(--sb);color:var(--tl);padding:10px 20px;font-size:12px}.tabs button.on{background:var(--pr);color:#fff}
.pan{display:none;overflow:auto;flex:1}.pan.on{display:block}
.dh{background:var(--pd);color:#fff;text-align:center;padding:10px}.dh b{font-size:15px;display:block}.dh i{color:var(--tl);font-size:11px;color:#CBD5E1}
table{border-collapse:separate;border-spacing:1px;width:100%}th{background:var(--sb);color:var(--ac);padding:7px 8px;font-size:12px}
td{padding:2px;text-align:center;background:#fff}tr:nth-child(odd) td{background:var(--s)}td.n{font-weight:700;color:var(--ac)}
.g{padding:15px}.g table{width:100%}.tg{display:block;color:#fff;font-weight:700;padding:6px;font-size:12px}
.nt{margin:4px 15px 15px;padding:10px 14px;background:var(--s);border:1px solid var(--bd);font:12px Consolas,monospace;color:var(--tl)}
#pv{background:var(--p);border:1px solid var(--bd);display:flex;flex-direction:column}#pv h5{margin:0;background:var(--sb);color:var(--ac);padding:8px;text-align:center;font-size:12px}
canvas{display:block}#cv{flex:1;width:100%;min-height:380px}
footer{background:var(--pd);height:32px;display:flex;align-items:center;border-left:3px solid var(--ac);color:#fff;font-size:12px;gap:6px;padding-right:14px}
#dot{color:var(--sl);margin-left:12px;font-size:14px}#bar{width:120px;height:8px;background:var(--bd)}#bar i{display:block;height:100%;width:0;background:var(--ac)}
.ov{position:fixed;inset:0;background:#0008;z-index:9;display:flex;align-items:center;justify-content:center}
.win{background:var(--bg);width:min(1300px,96vw);height:92vh;display:flex;flex-direction:column;overflow:hidden}
.mh{background:var(--pd);border-top:4px solid var(--ac);color:#fff;display:flex;align-items:center;padding:10px 20px;gap:14px}.mh .bn{background:var(--ac);color:var(--pd);font:700 22px inherit;width:48px;height:48px;display:grid;place-items:center}.mh b{font-size:16px;display:block}.mh i{font-size:11px;color:#CBD5E1}.mh button{margin-left:auto;background:var(--er)}
.mb{overflow:auto;flex:1;padding:12px 14px}.kp{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.k{background:var(--p);border:1px solid var(--bd);border-left:5px solid var(--ac);padding:8px 14px}.k small{display:block;font:700 8px inherit;color:var(--tl);text-transform:uppercase}.k b{font-size:16px}.k i{display:block;font-size:11px;color:var(--tl)}
.d table td{font:12px Consolas,monospace;padding:5px 8px;white-space:nowrap}.d th{background:var(--pd);color:#fff}.d{overflow-x:auto;background:var(--p);padding:12px;border:1px solid var(--bd)}
.sc{background:var(--s);border:1px solid var(--bd);border-left:5px solid var(--ac);padding:8px 14px;font-weight:700;font-size:13px;margin:4px 0 10px}
.bd{background:var(--er)!important;color:#fff}
@media(max-width:1000px){main{grid-template-columns:1fr}}
</style><style>.vt-bar{background:#0B1728;padding:6px 14px;display:flex;align-items:center;justify-content:flex-start}.vt-back{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 16px;background:#0E7490;color:#fff;text-decoration:none;font:700 13px "Segoe UI",system-ui,sans-serif;border:1px solid #fff6;border-radius:6px;box-shadow:0 1px 4px #0006;transition:background .2s}.vt-back:hover,.vt-back:focus-visible{background:#1E3A5F;outline:2px solid #fff}.vt-back span{font-size:14px;line-height:1}@media print{.vt-bar{display:none}}</style></head><body><div class="vt-bar"><a class="vt-back" href="index.html" title="Volver al menú principal" aria-label="Volver al menú principal"><span>◀</span>Volver al menú principal</a></div>
<header><div class="badge"><small>MÓDULO</small><b>FLUJOS</b></div><canvas id="logo" width="280" height="85"></canvas></header>
<div class="card t"><b style="font-size:13px">Número de Nodos (N):</b><input id="n" class="w" value="3" style="font-size:14px">
 <button onclick="build()">  Generar Tablas  </button><span class="l" style="margin-left:22px;font-weight:700">Reabrir:</span>
 <span id="re"></span><button id="bf" disabled style="margin-left:auto;background:var(--am);padding:9px 20px;font-size:13px" onclick="fin()">★ RESULTADOS FINALES</button></div>
<div class="card"><span class="hl">DATOS DEL SISTEMA</span><span class="l">Potencia base:</span><input id="sbm" class="w" value="100"><span class="u">MVA</span>
 <span class="l">Voltaje base:</span><input id="vbk" class="w" value="220"><span class="u">kV</span><i class="l" style="font:italic 12px Consolas,monospace;color:var(--tll)">→  Z_base = (V_base)² / S_base</i></div>
<main><aside id="side"><h4>PANEL DE CONTROL</h4><div id="sts"></div><div class="pie"><i>por Kevin</i><span>Vatia © 2026</span></div></aside>
<section id="nb"><div class="tabs"></div><div id="p0" class="pan on"></div><div id="p1" class="pan"></div><div id="p2" class="pan"></div><div id="p3" class="pan"></div></section>
<section id="pv"><h5>VISTA PREVIA UNIFILAR</h5><canvas id="cv"></canvas></section></main>
<div class="card"><div class="gr"><small>Archivo</small><div><button onclick="csv()">Exportar</button></div></div>
 <div class="gr"><small>Cálculo</small><div id="cb"></div></div>
 <div class="gr"><small>Vista</small><div><button style="background:var(--in)" onclick="big()">Diagrama Unifilar</button><button style="background:var(--ac)" onclick="conv()">Convergencia</button></div></div>
 </div>
<footer><span id="dot">●</span><span id="stt">Listo.</span><span style="margin-left:auto" class="l"></span><span style="font-size:8px;font-weight:700;color:var(--tl)">PROGRESO</span><div id="bar"><i></i></div><span style="font:8px Consolas,monospace;color:var(--tll);margin-left:14px">v1.0  ·  Vatia</span></footer>
<script>
const $=s=>document.querySelector(s),F=(v,d=0)=>{v=parseFloat(String(v).replace(',','.'));return isNaN(v)?d:v};
const COL={1:'#C2410C',2:'#6D28D9',3:'#047857'},NOM={1:'PQ',2:'PV',3:'Slack'},RNG={1:'#FFEDD5',2:'#EDE9FE',3:'#D1FAE5'};
let IT=[],CFG=null,LAST=-1;
const tp=i=>{const v=$('#t'+i).value;return v[0]=='S'?3:v[1]=='V'?2:1};
const hdr=(a,b)=>`<div class="dh"><b>${a}</b><i>${b}</i></div>`;
const inp=(id,v)=>`<td><input id="${id}" value="${v}">`;
const fe=x=>x==null?'—':x.toExponential(3);

function build(){
 const n=parseInt($('#n').value);if(!(n>=2&&n<=20)){alert(n<2?'Mínimo 2 nodos.':'Ingrese un número entero entre 2 y 20.');return}
 IT=[];CFG=null;LAST=-1;let a='',b='',l='',z='';
 for(let i=0;i<n;i++){const k=`<tr><td class="n">${i+1}`;
  a+=k+`<td><select id="t${i}" onchange="tch()"><option>Slack (3)<option>PV (2)<option selected>PQ (1)</select>${inp('V'+i,'')}${inp('th'+i,'')}</tr>`;
  b+=k+`<td><span class="tg" id="pl${i}"></span>${['Pd','Qd','Pg','Qg'].map(q=>inp(q+i,'0.0')).join('')}</tr>`;
  l+='<tr>'+[0,1,2,3,4].map(j=>inp(`l${i}_${j}`,'')).join('')+'</tr>';
  z+=k+`<td><span class="tg" id="il${i}"></span>${inp('v0'+i,'1.0')}${inp('t0'+i,'0.0')}</tr>`}
 const T=(h,r)=>`<div class="g"><table><tr>${h.map(x=>'<th>'+x).join('')}</tr>${r}</table></div>`;
 $('#p0').innerHTML=hdr('DATOS NODALES','Tipo de nodo  ·  Tensión  ·  Ángulo')+T(['Nodo','Tipo','|V| (p.u.)','θ (grados)'],a);
 $('#p1').innerHTML=hdr('POTENCIAS NODALES','Potencias demandadas y generadas en MW / MVAr  ·  Base 100 MVA')+T(['Nodo','Tipo','Pd (MW)','Qd (MVAr)','Pg (MW)','Qg (MVAr)'],b)+'<div class="nt">Nota:  La potencia neta inyectada (P_esp, Q_esp) se calcula como<br>P_esp = (Pg − Pd)/S_base p.u.    y    Q_esp = (Qg − Qd)/S_base p.u.</div>';
 $('#p2').innerHTML=hdr('DATOS DE LÍNEAS','Conecte nodos y defina admitancia serie y shunt')+T(['Nodo A','Nodo B','G (p.u.)','B (p.u.)','y_shunt/2 (p.u.)'],l);
 $('#p3').innerHTML=hdr('VALORES INICIALES — ITERACIÓN 0','Valores de arranque para el proceso iterativo')+T(['Nodo','Tipo','V0 (p.u.)','θ0 (grados)'],z);
 $('#t0').value='Slack (3)';tch();btns();prog(0);stat('Sistema de '+n+' nodos configurado.');side();prev()}
function tch(){const n=+$('#n').value;let s=-1;
 for(let i=0;i<n;i++)if(tp(i)==3){s=i;break}
 for(let i=0;i<n;i++){const e=$('#t'+i),v=e.value;
  e.innerHTML=(i==s||s<0?'<option>Slack (3)':'')+'<option>PV (2)<option>PQ (1)';e.value=v;if(!e.value)e.value='PQ (1)';
  const t=tp(i);['pl','il'].forEach(p=>{const q=$('#'+p+i);q.textContent=NOM[t];q.style.background=COL[t]})}
 prev();side()}
function tabs(){const nm=['Datos Nodales','Potencias Nodales','Datos de Líneas','Iteración 0'];
 $('.tabs').innerHTML=nm.map((x,i)=>`<button class="${i?'':'on'}" onclick="sw(${i})">${x}</button>`).join('')}
function sw(k){document.querySelectorAll('.pan').forEach((p,i)=>p.classList.toggle('on',i==k));document.querySelectorAll('.tabs button').forEach((p,i)=>p.classList.toggle('on',i==k))}
function btns(){const cl=['var(--pq)','var(--sl)','var(--pv)','var(--er)'];
 $('#cb').innerHTML=[0,1,2,3].map(k=>`<button id="c${k}" style="background:${cl[k]}" ${k==LAST+1?'':'disabled'} onclick="go(${k})">Iter ${k}</button>`).join('')+'<button id="ca" style="background:var(--pd);margin-left:10px" onclick="all()">Calcular todo</button>';
 $('#re').innerHTML=[0,1,2,3].map(k=>`<button class="sf" style="margin:0 2px;padding:5px 12px" ${k<=LAST?'':'disabled'} onclick="show(${k})">Iter ${k}</button>`).join('');
 $('#bf').disabled=LAST<3;$('#bf').style.background=LAST<3?'var(--s)':'#F59E0B';$('#bf').style.color=LAST<3?'var(--tl)':'#fff'}
function stat(t,c){$('#stt').textContent=t;$('#dot').style.color=c||'var(--ac)'}
function prog(v){$('#bar i').style.width=v*100+'%';$('#bar i').style.background=v>=1?'var(--sl)':'var(--ac)'}

function read(){const n=+$('#n').value,S=F($('#sbm').value,100)||100,VB=F($('#vbk').value,220)||220,nodes=[],L=[];
 for(let i=0;i<n;i++){const t=tp(i),Pd=F($('#Pd'+i).value),Qd=F($('#Qd'+i).value),Pg=F($('#Pg'+i).value),Qg=F($('#Qg'+i).value);
  let V=F($('#v0'+i).value,1),th=F($('#t0'+i).value)*Math.PI/180;
  if(t!=1){V=F($('#V'+i).value,1);th=F($('#th'+i).value)*Math.PI/180}
  nodes.push({t,Pd,Qd,Pg,Qg,V,th,Pe:(Pg-Pd)/S,Qe:(Qg-Qd)/S})}
 for(let i=0;i<n;i++){const a=parseInt(F($(`#l${i}_0`).value)),b=parseInt(F($(`#l${i}_1`).value));
  if(a>=1&&b>=1&&a<=n&&b<=n&&a!=b)L.push({a:a-1,b:b-1,G:F($(`#l${i}_2`).value),B:F($(`#l${i}_3`).value),sh:F($(`#l${i}_4`).value)})}
 return{n,S,VB,nodes,L}}
function ybus(n,L){const G=[...Array(n)].map(_=>Array(n).fill(0)),B=[...Array(n)].map(_=>Array(n).fill(0));
 for(const l of L){const{a,b}=l;G[a][a]+=l.G;B[a][a]+=l.B+l.sh;G[b][b]+=l.G;B[b][b]+=l.B+l.sh;G[a][b]-=l.G;B[a][b]-=l.B;G[b][a]-=l.G;B[b][a]-=l.B}return{G,B}}
function solve(A,b){const n=b.length,M=A.map((r,i)=>[...r,b[i]]);
 for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;
  if(Math.abs(M[p][c])<1e-14)throw Error('Jacobiano singular');[M[c],M[p]]=[M[p],M[c]];
  for(let r=c+1;r<n;r++){const k=M[r][c]/M[c][c];for(let j=c;j<=n;j++)M[r][j]-=k*M[c][j]}}
 const x=Array(n).fill(0);for(let i=n-1;i>=0;i--){let s=M[i][n];for(let j=i+1;j<n;j++)s-=M[i][j]*x[j];x[i]=s/M[i][i]}return x}
function jac(n,nodes,G,B,th,V,P,Q){const ns=[],pq=[];nodes.forEach((d,i)=>{if(d.t!=3)ns.push(i);if(d.t==1)pq.push(i)});
 const m=ns.length+pq.length,J=[...Array(m)].map(_=>Array(m).fill(0));let r=0;
 for(const i of ns){let c=0;for(const j of ns){const d=th[i]-th[j];J[r][c++]=i==j?-Q[i]-B[i][i]*V[i]**2:V[i]*V[j]*(G[i][j]*Math.sin(d)-B[i][j]*Math.cos(d))}
  for(const k of pq){const d=th[i]-th[k];J[r][c++]=i==k?(Math.abs(V[i])<1e-12?0:P[i]/V[i]+G[i][i]*V[i]):V[i]*(G[i][k]*Math.cos(d)+B[i][k]*Math.sin(d))}r++}
 for(const i of pq){let c=0;for(const j of ns){const d=th[i]-th[j];J[r][c++]=i==j?P[i]-G[i][i]*V[i]**2:-V[i]*V[j]*(G[i][j]*Math.cos(d)+B[i][j]*Math.sin(d))}
  for(const k of pq){const d=th[i]-th[k];J[r][c++]=i==k?(Math.abs(V[i])<1e-12?0:Q[i]/V[i]-B[i][i]*V[i]):V[i]*(G[i][k]*Math.sin(d)-B[i][k]*Math.cos(d))}r++}
 return{J,ns,pq}}
function step(k){let V,th;
 if(k==0){CFG=read();if(!CFG.nodes.some(d=>d.t==3))throw Error('Defina un nodo Slack.');if(!CFG.L.length)throw Error('Defina al menos una línea en Datos de Líneas.');
  V=CFG.nodes.map(d=>d.V);th=CFG.nodes.map(d=>d.th);IT=[]}
 else{const p=IT[k-1];V=[...p.V];th=[...p.th];p.ns.forEach((i,r)=>th[i]+=p.dx[r]);p.pq.forEach((i,r)=>V[i]+=p.dx[p.ns.length+r])}
 const{n,nodes,L}=CFG,{G,B}=ybus(n,L),P=[],Q=[];
 for(let i=0;i<n;i++){let p=0,q=0;for(let j=0;j<n;j++){const d=th[i]-th[j];p+=V[j]*(G[i][j]*Math.cos(d)+B[i][j]*Math.sin(d));q+=V[j]*(G[i][j]*Math.sin(d)-B[i][j]*Math.cos(d))}P.push(V[i]*p);Q.push(V[i]*q)}
 const dP=nodes.map((d,i)=>d.t!=3?d.Pe-P[i]:null),dQ=nodes.map((d,i)=>d.t==1?d.Qe-Q[i]:null),{J,ns,pq}=jac(n,nodes,G,B,th,V,P,Q);
 const mis=[...ns.map(i=>dP[i]),...pq.map(i=>dQ[i])];IT[k]={V,th,P,Q,dP,dQ,J,mis,dx:solve(J,mis),ns,pq,G,B};LAST=k;btns();prog((k+1)/4);prev();side()}
function go(k){try{step(k);stat(k==3?'Iteración 3 calculada. Proceso completado.':`Iteración ${k} calculada.`,'var(--sl)');show(k)}catch(e){alert('Error: '+e.message)}}
function all(){try{if(!$('#t0'))return;LAST=-1;for(let k=0;k<4;k++)step(k);stat('Cálculo completado. 4 iteraciones ejecutadas.','var(--sl)');show(3)}catch(e){alert('Error: '+e.message)}}
function side(){const n=+$('#n').value;let s=0,v=0,q=0,nl=0;
 for(let i=0;i<n;i++){const t=$('#t'+i)&&tp(i);t==3?s++:t==2?v++:q++;if($(`#l${i}_0`)&&F($(`#l${i}_0`).value)>0&&F($(`#l${i}_1`).value)>0)nl++}
 const I=LAST>=0?IT[LAST]:null,e=I?Math.max(0,...I.dP.concat(I.dQ).filter(x=>x!=null).map(Math.abs)):0;
 const S=(l,x,c)=>`<div class="st"><small>${l}</small><b style="color:${c}">${x}</b></div>`,H='<hr>';
 $('#sts').innerHTML=S('Nodos del sistema',n,'var(--ac)')+S('Líneas de transmisión',nl,'var(--in)')+H+S('Nodos Slack',s,'var(--sl)')+S('Nodos PV',v,'var(--pv)')+S('Nodos PQ',q,'var(--pq)')+H+
  S('Última iteración',I?'Iter '+LAST:'—','var(--tx)')+S('Estado',I?(e<1e-3?'CONVERGIDO':e<.01?'CASI':'PENDIENTE'):'SIN CALCULAR',I?(e<1e-3?'var(--sl)':e<.01?'var(--in)':'var(--am)'):'var(--tl)')+S('Error máximo',I?e.toExponential(2):'—','var(--am)')}

/* ---------- Diagrama unifilar (vista previa y grande) ---------- */
function uni(cv,B){const n=+$('#n').value,x=cv.getContext('2d'),W=cv.width=cv.clientWidth||520,H=cv.height=cv.clientHeight||520,k=B?1.5:1;
 x.fillStyle='#fff';x.fillRect(0,0,W,H);x.textAlign='center';x.textBaseline='middle';
 const T=(t,a,b,f,c,al)=>{x.font=f;x.fillStyle=c;x.textAlign=al||'center';x.fillText(t,a,b)},O=(a,b,r,f,s,w)=>{x.beginPath();x.arc(a,b,r,0,7);if(f){x.fillStyle=f;x.fill()}if(s){x.strokeStyle=s;x.lineWidth=w;x.stroke()}};
 T(B?'DIAGRAMA UNIFILAR DEL SISTEMA':'Diagrama Unifilar — Vista Previa',W/2,26,`700 ${B?22:13}px Segoe UI`,'#1E3A5F');x.fillStyle='#0E7490';x.fillRect(W/2-100,B?44:40,200,2);
 const L=[];for(let i=0;i<n;i++){const a=parseInt(F($(`#l${i}_0`).value)),b=parseInt(F($(`#l${i}_1`).value));

function theory(){
  modal(mh('?', 'TEORÍA', 'Flujos de potencia — Newton-Raphson') + `
  <div class="mb" style="font:13px Consolas,monospace;line-height:1.85;padding:18px 28px">

    <div class="sc">1. ECUACIONES DE POTENCIA NODAL</div>
    Cada nodo tiene dos ecuaciones (P y Q) en función de V y θ:
    <div style="background:#F7F9FC;border:1px solid #CBD5E1;border-left:5px solid #0E7490;padding:10px 16px;margin:8px 0;font:11px Consolas">
      P_i = V_i · Σ_j V_j (G_ij·cos θ_ij + B_ij·sin θ_ij)<br>
      Q_i = V_i · Σ_j V_j (G_ij·sin θ_ij − B_ij·cos θ_ij)<br>
      con θ_ij = θ_i − θ_j
    </div>

    <div class="sc">2. CLASIFICACIÓN DE NODOS</div>
    <div style="margin:8px 0;padding:8px 14px;background:#D1FAE5;border-left:4px solid #047857">
      <b>Slack (barra infinita)</b><br>
      V y θ conocidos → P y Q se calculan
    </div>
    <div style="margin:8px 0;padding:8px 14px;background:#EDE9FE;border-left:4px solid #6D28D9">
      <b>PV (generador)</b><br>
      P y |V| conocidos → Q y θ se calculan
    </div>
    <div style="margin:8px 0;padding:8px 14px;background:#FFEDD5;border-left:4px solid #C2410C">
      <b>PQ (carga)</b><br>
      P y Q conocidos → |V| y θ se calculan
    </div>

    <div class="sc">3. MISMATCH (desbalance)</div>
    <div style="background:#F7F9FC;border:1px solid #CBD5E1;border-left:5px solid #0E7490;padding:10px 16px;margin:8px 0;font:11px Consolas">
      ΔP_i = P_esp,i − P_calc,i    (nodos PQ y PV)<br>
      ΔQ_i = Q_esp,i − Q_calc,i    (solo PQ)
    </div>

    <div class="sc">4. MATRIZ JACOBIANA</div>
    <div style="background:#F7F9FC;border:1px solid #CBD5E1;border-left:5px solid #0E7490;padding:10px 16px;margin:8px 0;font:11px Consolas">
      [ ΔP ]   [ H  N ]   [ Δθ ]<br>
      [ ΔQ ] = [ M  L ] · [ ΔV ]<br><br>
      H_ii = −Q_i − B_ii·V_i²<br>
      H_ij = V_i·V_j·(G_ij·sin θ_ij − B_ij·cos θ_ij)<br>
      N_ii = P_i/V_i + G_ii·V_i<br>
      N_ij = V_i·(G_ij·cos θ_ij + B_ij·sin θ_ij)<br>
      M_ii = P_i − G_ii·V_i²<br>
      M_ij = −V_i·V_j·(G_ij·cos θ_ij + B_ij·sin θ_ij)<br>
      L_ii = Q_i/V_i − B_ii·V_i<br>
      L_ij = V_i·(G_ij·sin θ_ij − B_ij·cos θ_ij)
    </div>

    <div class="sc">5. LOS 7 PASOS DEL MÉTODO</div>
    <ol style="padding-left:26px;line-height:1.9">
      <li><b>Inicialización</b>: V=1.0 p.u., θ=0 rad (flat start). Construir Ybus.</li>
      <li><b>Calcular P_calc, Q_calc</b> con las ecuaciones del punto 1.</li>
      <li><b>Calcular mismatch</b> ΔP y ΔQ.</li>
      <li><b>Verificar convergencia</b>: si max|ΔP|, max|ΔQ| &lt; ε (1e-3 p.u.), terminar.</li>
      <li><b>Construir Jacobiano</b> J(V, θ).</li>
      <li><b>Resolver</b> J·Δx = mismatch → Δx = J⁻¹·mismatch.</li>
      <li><b>Actualizar</b> θ_i += Δθ_i ; V_i += ΔV_i. Volver al paso 2.</li>
    </ol>

    <div class="sc">6. CONVERGENCIA CUADRÁTICA</div>
    El error se reduce al cuadrado en cada iteración:
    <div style="background:#F7F9FC;border:1px solid #CBD5E1;border-left:5px solid #0E7490;padding:10px 16px;margin:8px 0;font:11px Consolas">
      Si error_k = ε, entonces error_{k+1} ≈ ε²<br>
      Con 3–5 iteraciones se alcanza precisión de 4–6 cifras
    </div>

    <div class="sc">7. YBUS</div>
    Se construye sumando las admitancias serie de cada línea:
    <div style="background:#F7F9FC;border:1px solid #CBD5E1;border-left:5px solid #0E7490;padding:10px 16px;margin:8px 0;font:11px Consolas">
      Y_ii = Σ y_km + y_shunt,ii<br>
      Y_ik = −y_ik<br>
      con y_km = G_km + j·B_km
    </div>

    <div class="sc">8. BASES Y CONVERSIÓN</div>
    <div style="background:#F7F9FC;border:1px solid #CBD5E1;border-left:5px solid #0E7490;padding:10px 16px;margin:8px 0;font:11px Consolas">
      Z_base = V_base² / S_base   [Ω]<br>
      P_real (MW) = P_pu · S_base<br>
      V_real (kV) = V_pu · V_base
    </div>

    <div class="sc">9. CRITERIO DE PARADA</div>
    El proceso itera hasta que el máximo desbalance esté por debajo de la tolerancia:
    <div style="background:#F7F9FC;border:1px solid #CBD5E1;border-left:5px solid #0E7490;padding:10px 16px;margin:8px 0;font:11px Consolas">
      max(|ΔP_i|, |ΔQ_i|) &lt; ε<br>
      ε típico = 1e-3 p.u.
    </div>

    <div class="sc">10. ATAJOS DE TECLADO</div>
    <ul style="padding-left:26px;line-height:1.9">
      <li><b>F5</b> — ejecutar iteración 0</li>
      <li><b>F1</b> — abrir esta ventana de teoría</li>
      <li><b>Ctrl + rueda</b> — zoom en el diagrama unifilar</li>
    </ul>

  </div>`);
}
